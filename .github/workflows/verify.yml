name: Verify Android app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Build, test and lint
        run: ./gradlew --no-daemon clean :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
